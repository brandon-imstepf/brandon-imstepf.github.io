<!-- ===== 3D simulation (scene, spec tabs, action bar) ===== -->

<style>
/* Layout: a full-bleed 3D graveyard stage; a codex card top-left, spec tabs and an action bar along the bottom. Single committed night theme. */
:root {
  color-scheme: dark;
  --night: #0a0d10;
  --stone: #12171b;
  --bone: #e6dfcd;
  --ash: #a0a8a9;
  --line: rgba(230, 223, 205, 0.16);
  --veil: rgba(9, 12, 15, 0.74);
  --spec: #7fe0c4;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--bone);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
}
.stage { position: fixed; inset: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.ui {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ui > * { pointer-events: auto; }

.codex {
  align-self: flex-start;
  width: min(380px, 100%);
  max-height: 46vh; overflow-y: auto;
  background: var(--veil);
  backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  border-left: 2px solid var(--spec);
  border-radius: 4px;
  padding: 16px 18px 14px;
  display: flex; flex-direction: column; gap: 8px;
  transition: border-color .6s;
}
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash); margin: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 0; text-wrap: balance; }
.role { margin: 0; color: var(--spec); font-weight: 500; letter-spacing: .02em; transition: color .6s; }
.desc { margin: 0; line-height: 1.45; color: var(--bone); }
.abilities { list-style: none; margin: 4px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
.abilities li { display: grid; grid-template-columns: 8px 1fr; gap: 8px; line-height: 1.35; font-size: 14px; color: var(--ash); }
.abilities li::before { content: ""; width: 6px; height: 6px; margin-top: 7px; transform: rotate(45deg); background: var(--spec); transition: background .6s; }
.abilities b { color: var(--bone); font-weight: 700; }

.bottom { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.specs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.specs button {
  font: 500 14px var(--body); color: var(--ash);
  background: var(--veil); border: 1px solid var(--line); border-radius: 3px;
  padding: 7px 14px; cursor: pointer; letter-spacing: .03em;
}
.specs button:hover { color: var(--bone); }
.specs button[aria-selected="true"] { color: var(--night); background: var(--spec); border-color: var(--spec); }
.specs button:focus-visible, .bar button:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }

.bar {
  display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; gap: 8px;
  background: var(--veil); border: 1px solid var(--line); border-radius: 4px; padding: 8px;
  max-width: 100%;
}
.readout { display: flex; gap: 14px; align-items: center; padding: 0 10px; font-variant-numeric: tabular-nums; }
.readout div { display: flex; flex-direction: column; line-height: 1.1; }
.readout span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
.readout strong { font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--bone); }
.exhume { display: block; width: 52px; height: 3px; margin-top: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.exhume b { display: block; height: 100%; width: 0; background: var(--spec); }
.bar button {
  position: relative; overflow: hidden;
  width: 92px; min-height: 58px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 2px;
  font: 500 13px/1.15 var(--body); color: var(--bone); text-align: left;
  background: var(--stone); border: 1px solid var(--line); border-radius: 3px;
  padding: 6px 8px; cursor: pointer;
}
.bar button:hover { border-color: var(--spec); }
.bar button kbd { font: 11px var(--body); color: var(--ash); }
.bar button small { font-size: 11px; color: var(--spec); transition: color .6s; }
.bar button .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.55); pointer-events: none; }
.hint { margin: 0; font-size: 12px; color: var(--ash); text-align: center; }

.toast {
  position: fixed; left: 50%; top: 40%; transform: translateX(-50%);
  font-family: var(--display); font-size: 22px; color: #ff8f7a; text-shadow: 0 2px 8px #000;
  pointer-events: none; opacity: 0; transition: opacity .3s;
}
.toast.show { opacity: 1; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ash); }

@media (max-width: 560px) {
  .codex { max-height: 34vh; padding: 12px 14px; }
  .desc { font-size: 14px; }
  .bar button { width: calc(33% - 6px); min-height: 50px; }
  .readout { width: 100%; justify-content: center; }
}
</style>

<div class="stage" id="stage"><div class="fail">Loading the 3D scene…</div></div>
<div class="ui">
  <section class="codex" aria-live="polite">
    <p class="eyebrow">WoW Forever · class concept</p>
    <h1 id="spec-name">Necromancer</h1>
    <p class="role" id="spec-role">Cloth caster · Mana + Corpses</p>
    <p class="desc" id="spec-desc"></p>
    <ul class="abilities" id="spec-abilities"></ul>
  </section>
  <div class="bottom">
    <div class="specs" role="tablist" aria-label="Specializations">
      <button role="tab" id="tab-overview" data-spec="overview" aria-selected="true">Overview</button>
      <button role="tab" id="tab-legion" data-spec="legion" aria-selected="false">Legion</button>
      <button role="tab" id="tab-plaguebringer" data-spec="plaguebringer" aria-selected="false">Plaguebringer</button>
      <button role="tab" id="tab-lich" data-spec="lich" aria-selected="false">Lich</button>
    </div>
    <div class="bar" aria-label="Action bar">
      <div class="readout">
        <div><span>Corpses</span><strong id="corpse-count">0/3</strong><i class="exhume" title="Exhume progress"><b id="exhume-fill"></b></i></div>
        <div><span>Servants</span><strong id="servant-count">0/4</strong></div>
      </div>
      <button id="act-enemy" data-act="enemy"><kbd>1</kbd>Enemy dies<small>simulate a kill</small><i class="cd"></i></button>
      <button id="act-raise" data-act="raise"><kbd>2</kbd>Raise Dead<small>1 corpse</small><i class="cd"></i></button>
      <button id="act-explode" data-act="explode"><kbd>3</kbd>Corpse Explosion<small>1 corpse</small><i class="cd"></i></button>
      <button id="act-armor" data-act="armor"><kbd>4</kbd>Bone Armor<small>optional corpse</small><i class="cd"></i></button>
      <button id="act-signature" data-act="signature" hidden><kbd>5</kbd><span id="sig-name">Signature</span><small id="sig-cost"></small><i class="cd"></i></button>
    </div>
    <p class="hint">Drag to orbit, scroll to zoom. Built-in shapes stand in for real art. Timings are sped up: Exhume fills every 3.5 s here, 6 s in the design.</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
function showError(msg) {
  var st = document.getElementById('stage');
  if (!st) return;
  st.innerHTML = '<div class="fail">The 3D scene could not start: ' + String(msg).replace(/[<&]/g, '') + '</div>';
}
window.addEventListener('error', function (e) { if (e.message) showError(e.message); });
if (typeof THREE === 'undefined') { showError('the 3D library did not load'); return; }
try {
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Spec content ---------- */
const SPECS = {
  overview: {
    name: 'Necromancer', role: 'Cloth caster · Mana + Corpses', color: '#7fe0c4',
    desc: 'A death-mage who turns the dead into servants, ammunition and armor. Each nearby death adds a corpse to the Necromancer’s own floating store, and the Exhume passive keeps it supplied in any fight. Nobody competes for corpses.',
    abilities: [['Exhume', 'your store gains a corpse every few seconds, in any fight.'], ['Raise Dead', 'spend a corpse; a skeleton rises at your side.'], ['Corpse Explosion', 'hurl a stored corpse; it bursts on impact.'], ['Bone Armor', 'an absorb shield, doubled by spending a corpse.']],
    sig: null, cap: 3, cam: [7.5, 4.4, 9.5], target: [0, 1.6, 0]
  },
  legion: {
    name: 'Legion', role: 'Ranged DPS / Support', color: '#f0c46a',
    desc: 'The army commander. Six servants at once, always cycling. With three or more servants up, the whole party fights faster.',
    abilities: [['Death’s Herald', 'party gains 5% attack and casting speed while 3+ servants stand.'], ['Charnel Wagon', 'store +1 and a faster Exhume.'], ['Shambling Ranks', 'expiring servants return their corpse to your store.'], ['Army of the Damned', 'spend every stored corpse; all rise at once, beyond the cap.']],
    sig: ['Army of the Damned', 'all stored'], cap: 4, cam: [0, 8, 10.5], target: [0, 0.8, 0]
  },
  plaguebringer: {
    name: 'Plaguebringer', role: 'Ranged DPS', color: '#a9d94c',
    desc: 'Disease and detonation. Enemies that die diseased fill the store with Infected Corpses, and hurling one spreads the plague to everything it hits.',
    abilities: [['Plague Bearer', 'diseased deaths store Infected Corpses that spread Wither when hurled.'], ['Bone Spear', 'a piercing line, empowered by a spent corpse.'], ['Pestilence Incarnate', 'disease ticks can add corpses to your store.']],
    sig: ['Bone Spear', 'optional corpse'], cap: 4, cam: [-8.5, 3.6, 6.5], target: [1, 1.2, 0]
  },
  lich: {
    name: 'Lich', role: 'Tank', color: '#8fd0ff',
    desc: 'A cloth tank wrapped in bone and frost. Spent corpses become Ossuary charges that blunt physical hits; a phylactery cheats death once.',
    abilities: [['Lichborne', 'tanking form: armor, stamina and threat.'], ['Ossuary', 'each corpse you spend adds a bone charge, up to 5.'], ['Frost Nova', 'frost damage and slow around the Lich.'], ['Phylactery', 'a killing blow shatters the phylactery instead.']],
    sig: ['Frost Nova', 'no corpse'], cap: 4, cam: [3.4, 2.7, 5.6], target: [0, 1.8, 0]
  }
};

/* ---------- Setup ---------- */
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  stage.innerHTML = '<div class="fail">This preview needs WebGL, which this browser has turned off.</div>';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

stage.innerHTML = ''; stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#090c12');
scene.fog = new THREE.FogExp2('#0b1016', 0.045);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(14, 11, 18);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 3.5; controls.maxDistance = 22;
controls.target.set(0, 1.2, 0);
controls.autoRotate = !reduced; controls.autoRotateSpeed = 0.35;

let composer = null, bloom = null;
if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass) {
  try {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.8, 0.5, 0.7);
    composer.addPass(bloom);
  } catch (e) { composer = null; bloom = null; }
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  if (bloom) bloom.resolution.set(w / 2, h / 2);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

/* ---------- Utilities ---------- */
let seed = 11;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const lerp = (a, b, t) => a + (b - a) * t;
const specColor = new THREE.Color(SPECS.overview.color);
const targetColor = new THREE.Color(SPECS.overview.color);

const M = {
  bone: new THREE.MeshStandardMaterial({ color: '#d9cfb3', roughness: 0.75 }),
  robe: new THREE.MeshStandardMaterial({ color: '#1b1e29', roughness: 0.95, side: THREE.DoubleSide }),
  robeDark: new THREE.MeshStandardMaterial({ color: '#111219', roughness: 1 }),
  void: new THREE.MeshBasicMaterial({ color: '#000000' }),
  glow: new THREE.MeshStandardMaterial({ color: '#000000', emissive: SPECS.overview.color, emissiveIntensity: 1.6 }),
  trim: new THREE.MeshStandardMaterial({ color: '#1b1e29', emissive: SPECS.overview.color, emissiveIntensity: 0.9, roughness: 0.6 }),
  stone: new THREE.MeshStandardMaterial({ color: '#3a4146', roughness: 0.95 }),
  wood: new THREE.MeshStandardMaterial({ color: '#2a2420', roughness: 1 }),
  soil: new THREE.MeshStandardMaterial({ color: '#2b2520', roughness: 1 }),
  metal: new THREE.MeshStandardMaterial({ color: '#6f7377', roughness: 0.4, metalness: 0.8 })
};
const accentMats = [M.glow, M.trim];

function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; return m;
}

/* ---------- World ---------- */
scene.add(new THREE.HemisphereLight('#5d7392', '#120e0c', 0.55));
const moonLight = new THREE.DirectionalLight('#a9bfe0', 1.4);
moonLight.position.set(-12, 16, -10);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(1024, 1024);
Object.assign(moonLight.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); moonLight.shadow.camera.updateProjectionMatrix();
scene.add(moonLight);
const moon = new THREE.Mesh(new THREE.SphereGeometry(2.2, 32, 16), new THREE.MeshBasicMaterial({ color: '#dfe6f2' }));
moon.material.fog = false; moon.position.set(-34, 26, -48); scene.add(moon);

const ground = mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: '#151b1d', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.castShadow = false; scene.add(ground);
for (let i = 0; i < 26; i++) {
  const p = mesh(new THREE.CircleGeometry(0.6 + rand() * 1.6, 12), new THREE.MeshStandardMaterial({ color: rand() > 0.5 ? '#1d2420' : '#211c18', roughness: 1 }));
  const a = rand() * Math.PI * 2, r = 3 + rand() * 13;
  p.rotation.x = -Math.PI / 2; p.position.set(Math.cos(a) * r, 0.005 + i * 0.0004, Math.sin(a) * r); p.castShadow = false; scene.add(p);
}
// ritual circle under the caster
const dais = mesh(new THREE.CylinderGeometry(1.7, 1.85, 0.14, 40), M.stone, 0, 0.07, 0); scene.add(dais);
const runeRing = new THREE.Mesh(new THREE.TorusGeometry(1.45, 0.025, 6, 80), M.trim);
runeRing.rotation.x = -Math.PI / 2; runeRing.position.y = 0.15; scene.add(runeRing);
for (let i = 0; i < 8; i++) {
  const g = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.01, 0.05), M.trim);
  const a = i / 8 * Math.PI * 2; g.position.set(Math.cos(a) * 1.6, 0.15, Math.sin(a) * 1.6); g.rotation.y = -a; scene.add(g);
}
// headstones and crosses
for (let i = 0; i < 18; i++) {
  const a = i / 18 * Math.PI * 2 + rand() * 0.25, r = 7.5 + rand() * 4;
  const g = new THREE.Group();
  if (rand() > 0.3) {
    g.add(mesh(new THREE.BoxGeometry(0.62, 0.8, 0.16), M.stone, 0, 0.4, 0));
    const arch = mesh(new THREE.CylinderGeometry(0.31, 0.31, 0.16, 16, 1, false, 0, Math.PI), M.stone, 0, 0.8, 0);
    arch.rotation.x = Math.PI / 2; arch.rotation.z = Math.PI / 2; g.add(arch);
  } else {
    g.add(mesh(new THREE.BoxGeometry(0.14, 1.3, 0.14), M.stone, 0, 0.65, 0));
    g.add(mesh(new THREE.BoxGeometry(0.62, 0.14, 0.14), M.stone, 0, 0.95, 0));
  }
  g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  g.rotation.set((rand() - 0.5) * 0.25, -a + Math.PI / 2, (rand() - 0.5) * 0.2);
  scene.add(g);
}
// dead trees
function tree(x, z, s) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(0.08, 0.28, 3.6, 7), M.wood, 0, 1.8, 0));
  for (let i = 0; i < 5; i++) {
    const len = 0.9 + rand() * 1.1;
    const b = mesh(new THREE.CylinderGeometry(0.02, 0.07, len, 5), M.wood);
    const pivot = new THREE.Group(); pivot.position.y = 1.6 + i * 0.4;
    b.position.y = len / 2; pivot.add(b);
    pivot.rotation.set(0, rand() * Math.PI * 2, 0.6 + rand() * 0.6); g.add(pivot);
  }
  g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
}
tree(-11, -6, 1.3); tree(10, -9, 1.1); tree(13, 5, 1.2); tree(-8, 11, 1.0); tree(2, -14, 1.4);
// fence posts at the edge
for (let i = 0; i < 40; i++) {
  const a = i / 40 * Math.PI * 2, r = 15;
  const post = mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.3, 5), M.metal, Math.cos(a) * r, 0.65, Math.sin(a) * r);
  post.rotation.z = (rand() - 0.5) * 0.15; scene.add(post);
}

/* ---------- Necromancer ---------- */
const necro = new THREE.Group();
{
  const robe = mesh(new THREE.ConeGeometry(0.66, 1.75, 12, 1, true), M.robe, 0, 0.88, 0); necro.add(robe);
  necro.add(mesh(new THREE.CylinderGeometry(0.25, 0.36, 0.62, 12), M.robe, 0, 1.55, 0));
  const belt = mesh(new THREE.TorusGeometry(0.33, 0.035, 6, 24), M.trim, 0, 1.22, 0); belt.rotation.x = Math.PI / 2; necro.add(belt);
  necro.add(mesh(new THREE.ConeGeometry(0.34, 0.7, 12), M.robeDark, 0, 2.12, -0.03));
  necro.add(mesh(new THREE.SphereGeometry(0.2, 16, 12), M.void, 0, 1.93, 0.06));
  necro.add(mesh(new THREE.SphereGeometry(0.03, 8, 6), M.glow, -0.07, 1.96, 0.24));
  necro.add(mesh(new THREE.SphereGeometry(0.03, 8, 6), M.glow, 0.07, 1.96, 0.24));
  for (const sx of [-1, 1]) {
    necro.add(mesh(new THREE.SphereGeometry(0.15, 12, 8), M.bone, sx * 0.33, 1.8, 0));
    for (let k = 0; k < 3; k++) {
      const spike = mesh(new THREE.ConeGeometry(0.04, 0.32 - k * 0.06, 6), M.bone, sx * (0.36 + k * 0.05), 1.95, -0.05 + k * 0.06);
      spike.rotation.z = -sx * (0.35 + k * 0.2); necro.add(spike);
    }
    const arm = mesh(new THREE.CylinderGeometry(0.07, 0.1, 0.72, 8), M.robe, sx * 0.42, 1.45, 0.08);
    arm.rotation.z = sx * 0.25; arm.rotation.x = -0.35; necro.add(arm);
  }
  // staff with a skull head
  const staff = new THREE.Group(); staff.position.set(0.58, 0, 0.22);
  staff.add(mesh(new THREE.CylinderGeometry(0.03, 0.04, 2.5, 6), M.wood, 0, 1.25, 0));
  staff.add(mesh(new THREE.SphereGeometry(0.13, 14, 10), M.bone, 0, 2.58, 0));
  staff.add(mesh(new THREE.BoxGeometry(0.15, 0.05, 0.12), M.bone, 0, 2.47, 0.03));
  staff.add(mesh(new THREE.SphereGeometry(0.025, 6, 6), M.glow, -0.045, 2.6, 0.11));
  staff.add(mesh(new THREE.SphereGeometry(0.025, 6, 6), M.glow, 0.045, 2.6, 0.11));
  for (const sx of [-1, 1]) {
    const horn = mesh(new THREE.ConeGeometry(0.03, 0.34, 6), M.bone, sx * 0.13, 2.72, 0); horn.rotation.z = -sx * 0.6; staff.add(horn);
  }
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), M.glow); orb.position.set(0, 2.85, 0); staff.add(orb);
  necro.add(staff);
  necro.userData.staffTip = new THREE.Vector3(0.58, 2.85, 0.22);
}
necro.position.y = 0.14;

  if (ossuary >= 5) { ossuaryTimer = 0; return; }
  ossuary++; ossuaryTimer = 0;
  const s = mesh(new THREE.ConeGeometry(0.06, 0.32, 5), M.bone); scene.add(s); ossuaryShards.push(s);
}

/* ---------- Spec scripts (ambient demo loop) ---------- */
const SCRIPTS = {
  overview: { len: 14, steps: [[0.6, 'enemy'], [2.2, 'raise'], [4, 'enemy'], [5.5, 'explode'], [8, 'enemy'], [8.8, 'enemy'], [10.5, 'armor'], [12, 'raise']] },
  legion: { len: 16, steps: [[0.4, 'enemy'], [0.9, 'enemy'], [1.6, 'raise'], [2.6, 'raise'], [4, 'enemy'], [4.8, 'raise'], [6.5, 'raise'], [8, 'enemy'], [8.4, 'enemy'], [9.5, 'raise'], [11.5, 'signature']] },
  plaguebringer: { len: 15, steps: [[0.4, 'wither'], [1, 'enemy'], [1.5, 'enemy'], [2.5, 'explode'], [4.2, 'signature'], [6, 'enemy'], [7, 'explode'], [8.5, 'wither'], [9.2, 'enemy'], [10, 'enemy'], [11.5, 'explode'], [13, 'signature']] },
  lich: { len: 14, steps: [[0.5, 'armor'], [2, 'signature'], [3.5, 'decay'], [5, 'enemy'], [6.5, 'armor'], [8.5, 'signature'], [10, 'enemy'], [11, 'enemy']] }
};
const extraSteps = {
  wither() { witherT = 6; for (let i = 0; i < 6; i++) witherPuff(randomGroundPoint(2.5, 6.5)); },
  decay: deathAndDecay
};
let spec = 'overview', specClock = 0;
const EXHUME_EVERY = 3.5;
let exhumeT = 0;

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
function setSpec(name, fromHash) {
  if (!SPECS[name]) name = 'overview';
  spec = name; specClock = 0;
  const S = SPECS[name];
  $('spec-name').textContent = S.name;
  $('spec-role').textContent = S.role;
  $('spec-desc').textContent = S.desc;
  $('spec-abilities').innerHTML = S.abilities.map(([n, d]) => `<li><span><b>${n}</b> — ${d}</span></li>`).join('');
  document.documentElement.style.setProperty('--spec', S.color);
  targetColor.set(S.color);
  document.querySelectorAll('.specs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.spec === name)));
  const sig = $('act-signature');
  sig.hidden = !S.sig;
  if (S.sig) { $('sig-name').textContent = S.sig[0]; $('sig-cost').textContent = S.sig[1]; }
  crown.visible = name === 'lich';
  if (name !== 'lich') { ossuary = 0; ossuaryShards.splice(0).forEach(s => scene.remove(s)); }
  while (stored.length > S.cap) { const s = stored.pop(); halo.remove(s.g); }
  camFrom = camera.position.clone(); tgtFrom = controls.target.clone();
  camTo = new THREE.Vector3(...S.cam); tgtTo = new THREE.Vector3(...S.target); camT = 0; camDur = 1.6;
  if (!fromHash) { try { history.replaceState(null, '', name === 'overview' ? location.pathname + location.search : '#' + name); } catch (e) { /* hash routing is optional */ } }
}
document.querySelectorAll('.specs button').forEach(b => b.addEventListener('click', () => setSpec(b.dataset.spec)));
addEventListener('hashchange', () => setSpec(location.hash.slice(1), true));

let userHold = 0;
function trigger(name, user) {
  if (cds[name] > 0) return;
  if (act[name](user)) cds[name] = CD[name];
}
document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => { trigger(b.dataset.act, true); userHold = 6; }));
addEventListener('keydown', e => {
  const map = { '1': 'enemy', '2': 'raise', '3': 'explode', '4': 'armor', '5': 'signature' };
  if (map[e.key] && !(e.key === '5' && !SPECS[spec].sig)) { trigger(map[e.key], true); userHold = 6; }
});

/* ---------- Camera intro ---------- */
let camFrom = camera.position.clone(), camTo = new THREE.Vector3(...SPECS.overview.cam);
let tgtFrom = controls.target.clone(), tgtTo = new THREE.Vector3(...SPECS.overview.target);
let camT = 0, camDur = 3.4;
const ease = t => 1 - Math.pow(1 - t, 3);

/* ---------- Initial state ---------- */
setSpec(location.hash.slice(1) || 'overview', true);
addSkull(false); addSkull(false);
camera.position.set(16, 12, 20); camFrom = camera.position.clone(); camT = 0; camDur = 3.4;

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
let ambientT = 0;
const barButtons = [...document.querySelectorAll('.bar button')];
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  specColor.lerp(targetColor, Math.min(1, dt * 3));
  for (const m of accentMats) m.emissive.copy(specColor);
  casterLight.color.copy(specColor);
  moonLight.color.set(spec === 'lich' ? '#b9d8ff' : '#a9bfe0');

  if (camT < 1) {
    camT = Math.min(1, camT + dt / camDur);
    const k = ease(camT);
    camera.position.lerpVectors(camFrom, camTo, k);
    controls.target.lerpVectors(tgtFrom, tgtTo, k);
  }
  controls.autoRotate = !reduced && camT >= 1;
  controls.update();
  if (shake > 0 && !reduced) {
    camera.position.x += (Math.random() - 0.5) * shake * 0.3;
    camera.position.y += (Math.random() - 0.5) * shake * 0.3;
  }
  shake = Math.max(0, shake - dt);

  necro.position.y = 0.14 + Math.sin(t * 1.4) * 0.04;
  necro.rotation.y = Math.sin(t * 0.3) * 0.25;
  crown.rotation.y += dt * 0.8;
  casterLight.intensity = 1.4 + Math.sin(t * 3) * 0.3;

  // demo script
  if (userHold > 0) userHold -= dt;
  else {
    const S = SCRIPTS[spec];
    const prev = specClock; specClock += dt;
    const cur = specClock % S.len, pv = prev % S.len;
    for (const [a, name] of S.steps) {
      const crossed = cur >= pv ? (a > pv && a <= cur) : (a > pv || a <= cur);
      if (crossed) { if (act[name]) { if (act[name](false)) cds[name] = Math.max(cds[name], 0.4); } else extraSteps[name](); }
    }
  }
  for (const k in cds) cds[k] = Math.max(0, cds[k] - dt);
  for (const b of barButtons) b.querySelector('.cd').style.height = (cds[b.dataset.act] / CD[b.dataset.act] * 100) + '%';
  witherT = Math.max(0, witherT - dt);

  // Exhume: the store refills on its own, in any fight
  if (stored.length + pending < capacity()) {
    exhumeT += dt * (spec === 'legion' ? 1.2 : 1);
    if (exhumeT >= EXHUME_EVERY) {
      exhumeT = 0;
      const a = Math.random() * Math.PI * 2, p = new THREE.Vector3(Math.cos(a) * 1.1, 0.15, Math.sin(a) * 1.1);
      emit(p, 30, '#7a5d43', { speed: 1.6, up: 1.4, gravity: 6, life: 0.7 });
      siphon(p, false, specColor);
    }
  } else exhumeT = 0;
  $('exhume-fill').style.width = (exhumeT / EXHUME_EVERY * 100) + '%';

  // floating store
  halo.position.copy(haloWorld());
  halo.rotation.y = t * 0.5;
  stored.forEach((s, i) => {
    const a = i / Math.max(1, stored.length) * Math.PI * 2;
    s.g.position.set(Math.cos(a) * 0.6, 0.13 + Math.sin(t * 2 + i) * 0.03, Math.sin(a) * 0.6);
    s.g.rotation.set(0, Math.atan2(Math.cos(a), Math.sin(a)), 0);
    s.g.scale.setScalar(Math.min(1, s.g.scale.x + dt * 4));
    s.g.userData.flame.scale.y = 1 + Math.sin(t * 9 + i * 2) * 0.25;
  });

  // remains on the battlefield
  for (let i = remains.length - 1; i >= 0; i--) {
    const r = remains[i]; r.age += dt;
    if (r.siphonAt && r.age >= r.siphonAt) {
      r.siphonAt = 0;
      siphon(r.g.position.clone().setY(0.4), r.infected, r.infected ? '#b6ff4f' : specColor);
    }
    if (r.state === 'body' && r.age > 1.0) {
      r.g.scale.y = Math.max(0.05, 1 - (r.age - 1.0) * 2.5);
      if (r.age > 1.4) {
        emit(r.g.position.clone().setY(0.2), 20, '#6b6460', { speed: 0.8, life: 0.6, spread: 0.4 });
        scene.remove(r.g); r.state = 'bag'; r.bag = makeBag(r.g.position);
      }
    } else if (r.state === 'bag') {
      const life = r.age - 1.4;
      r.bag.scale.setScalar(life < 0.3 ? Math.max(0.01, life / 0.3) : life > 8 ? Math.max(0.01, 1 - (life - 8) * 2) : 1);
      if (life > 8.5) { scene.remove(r.bag); remains.splice(i, 1); }
    }
  }

  // servants
  for (let i = servants.length - 1; i >= 0; i--) {
    const s = servants[i];
    s.age += dt;
    if (s.dying) {
      s.dying += dt;
      s.g.scale.y = Math.max(0.01, 1 - s.dying * 2.2);
      s.g.rotation.z += dt * 2;
      if (s.dying > 0.45) { scene.remove(s.g); servants.splice(i, 1); }
      continue;
    }
    if (s.age > s.life || (!s.extra && liveServants() > servantCap())) { expireServant(s); continue; }
    if (s.g.position.y < 0) { s.g.position.y = Math.min(0, s.g.position.y + dt * 1.6); continue; }
    s.angle += dt * 0.22;
    const tx = Math.cos(s.angle) * s.radius, tz = Math.sin(s.angle) * s.radius;
    const dx = tx - s.g.position.x, dz = tz - s.g.position.z, dist = Math.hypot(dx, dz);
    const step = Math.min(dist, dt * 1.6);
    if (dist > 0.01) { s.g.position.x += dx / dist * step; s.g.position.z += dz / dist * step; s.g.rotation.y = Math.atan2(dx, dz); }
    const w = Math.sin(t * 6 + s.phase) * 0.5;
    s.limbs.lLeg.rotation.x = w; s.limbs.rLeg.rotation.x = -w;
    s.limbs.lArm.rotation.x = -w * 0.6; s.limbs.rArm.rotation.x = w * 0.6 - 0.3;
  }
  const live = servants.filter(s => !s.dying).length;
  const heraldOn = spec === 'legion' && live >= 3;
  aura.material.opacity = lerp(aura.material.opacity, heraldOn ? 0.55 + Math.sin(t * 2) * 0.15 : 0, dt * 3);
  if (heraldOn && Math.random() < dt * 20) {
    const a = Math.random() * Math.PI * 2;
    emit(new THREE.Vector3(Math.cos(a) * 3.1, 0.1, Math.sin(a) * 3.1), 1, '#f0c46a', { speed: 0.1, lift: 0.9, life: 1.2, spread: 0.05 });
  }

  // bone armor
  if (armorPlates) {
    armorPlates.userData.life -= dt;
    armorPlates.children.forEach((p, i) => {
      const a = p.userData.a + t * 1.4;
      p.position.set(Math.cos(a) * 0.95, p.userData.h + necro.position.y + Math.sin(t * 2 + i) * 0.05, Math.sin(a) * 0.95);
      p.rotation.set(0, -a + Math.PI / 2, 0.15);
    });
    if (armorPlates.userData.life <= 0) {
      emit(new THREE.Vector3(0, 1.2, 0), 70, '#e6dfcd', { speed: 2.5, gravity: 6, life: 0.9, spread: 1 });
      scene.remove(armorPlates); armorPlates = null;
    }
  }
  // ossuary
  if (ossuary > 0) {
    ossuaryTimer += dt;
    if (ossuaryTimer > 8) { ossuaryTimer = 0; ossuary--; const s = ossuaryShards.pop(); emit(s.position, 15, '#e6dfcd', { speed: 1, life: 0.6 }); scene.remove(s); }
    ossuaryShards.forEach((s, i) => {
      const a = i / ossuaryShards.length * Math.PI * 2 - t * 0.9;
      s.position.set(Math.cos(a) * 0.85, 1.55 + necro.position.y, Math.sin(a) * 0.85);
      s.rotation.set(0, 0, Math.PI);
    });
  }

  ambientT += dt;
  if (ambientT > 0.06) {
    ambientT = 0;
    const p = randomGroundPoint(2, 13); p.y = 0.2 + Math.random();
    emit(p, 1, spec === 'plaguebringer' ? '#5f8f3a' : '#4f7f8f', { speed: 0.08, lift: 0.15, life: 4, spread: 0.1 });
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.t += dt;
    const p = Math.min(1, e.t / e.dur);
    e.update(e, p);
    if (p >= 1) { e.dispose(); effects.splice(i, 1); }
  }
  updateParticles(dt);

  $('corpse-count').textContent = `${stored.length}/${capacity()}`;
  $('servant-count').textContent = `${liveServants()}/${servantCap()}`;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }

  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
} catch (err) { showError(err && err.message ? err.message : err); }
})();
</script>
