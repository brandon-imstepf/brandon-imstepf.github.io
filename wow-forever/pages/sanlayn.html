<style>
/* Layout: full-bleed 3D stage; codex card top-left, resource meter + action bar + spec tabs along the bottom. Single committed night theme. */

html, body { height: 100%; }
body { background: var(--night); color: var(--bone); font-family: var(--body); font-size: 15px; overflow: hidden; }
.stage { position: fixed; inset: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ui > * { pointer-events: auto; }
.codex { align-self: flex-start; width: min(380px, 100%); max-height: 46vh; overflow-y: auto; background: var(--veil); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-left: 2px solid var(--spec); border-radius: 4px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color .6s; }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash); margin: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 0; text-wrap: balance; }
.role { margin: 0; color: var(--spec); font-weight: 500; letter-spacing: .02em; transition: color .6s; }
.desc { margin: 0; line-height: 1.45; }
.abilities { list-style: none; margin: 4px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
.abilities li { display: grid; grid-template-columns: 8px 1fr; gap: 8px; line-height: 1.35; font-size: 14px; color: var(--ash); }
.abilities li::before { content: ""; width: 6px; height: 6px; margin-top: 7px; transform: rotate(45deg); background: var(--spec); transition: background .6s; }
.abilities b { color: var(--bone); font-weight: 700; }
.bottom { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.specs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.specs button { font: 500 14px var(--body); color: var(--ash); background: var(--veil); border: 1px solid var(--line); border-radius: 3px; padding: 7px 14px; cursor: pointer; letter-spacing: .03em; }
.specs button:hover { color: var(--bone); }
.specs button[aria-selected="true"] { color: var(--night); background: var(--spec); border-color: var(--spec); }
.specs button:focus-visible, .bar button:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; gap: 8px; background: var(--veil); border: 1px solid var(--line); border-radius: 4px; padding: 8px; max-width: 100%; }

.meter span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); display: flex; justify-content: space-between; gap: 10px; }
.meter span b { color: var(--bone); font-weight: 700; letter-spacing: 0; text-transform: none; }
.meter i { display: block; height: 8px; border-radius: 2px; background: #0b0d10; border: 1px solid var(--line); overflow: hidden; }
.meter i em { display: block; height: 100%; width: 0; background: var(--spec); transition: width .15s linear; }
.bar button { position: relative; overflow: hidden; width: 96px; min-height: 58px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 2px;
  font: 500 13px/1.15 var(--body); color: var(--bone); text-align: left; background: var(--stone); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; cursor: pointer; }

<script>

  wood: std('#4a3626', { roughness: 1 }),
  cloth: std('#2a2f3a', { roughness: 0.95, side: THREE.DoubleSide }),
  skin: std('#d9b99a', { roughness: 0.7 }),
  glow: glowMat('#ffffff', 1.8),
  trim: new THREE.MeshStandardMaterial({ color: '#222', emissive: '#ffffff', emissiveIntensity: 0.6, roughness: 0.6 }),
  foe: std('#3a2c3c', { roughness: 0.85 }),
  foeEye: glowMat('#ff5a3c', 2),
  horn: std('#b9ad94', { roughness: 0.7 }),
  blade: std('#c9d0d6', { roughness: 0.25, metalness: 0.95 }),
  ally: std('#3b5b8f', { roughness: 0.7 }),
  allySkin: std('#c7a389', { roughness: 0.7 }),

const accentMats = [M.glow, M.trim];

const moon = new THREE.Mesh(new THREE.SphereGeometry(2.4, 32, 16), new THREE.MeshBasicMaterial({ color: '#e2e8f2', fog: false }));
moon.position.set(-36, 28, -46); scene.add(moon);
const groundMat = std('#14191c', { roughness: 1 });
const ground = mesh(new THREE.CircleGeometry(40, 64), groundMat);

/* ---------- Particles ---------- */
const MAXP = 4000;

{ const c = dotCanvas.getContext('2d'); const g = c.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, 64, 64); }

/* ---------- Projectiles and beams ---------- */
function bolt(from, toGet, color, size, dur, onHit, o) {
  o = o || {};
  const m = new THREE.Mesh(o.geo || new THREE.SphereGeometry(size || 0.15, 10, 8), o.mat || glowMat(color, 2.2));
  m.position.copy(from); scene.add(m);
  const start = from.clone();
  timed(dur || 0.5, function (e, p) {
    const end = toGet();
    m.position.lerpVectors(start, end, p); m.position.y += Math.sin(Math.PI * p) * (o.arc || 0);
    if (o.spin) m.rotation.x += 0.4;
    emit(m.position, o.trail || 2, color, { speed: 0.2, life: 0.4, spread: 0.05 });
  }, function () { scene.remove(m); if (onHit) onHit(m.position.clone()); });
}
function beam(getA, getB, dur, color, width) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(width || 0.05, width || 0.05, 1, 8, 1, true), addMat(color, 0.85));
  scene.add(m);
  timed(dur, function (e, p) {
    const a = getA(), b = getB();
    const mid = a.clone().add(b).multiplyScalar(0.5);
    m.position.copy(mid);
    m.scale.set(1 + Math.sin(e.t * 30) * 0.2, a.distanceTo(b), 1 + Math.sin(e.t * 30) * 0.2);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize());
    m.material.opacity = 0.85 * Math.min(1, (1 - p) * 5);
    if (Math.random() < 0.5) emit(a.clone().lerp(b, Math.random()), 1, color, { speed: 0.3, life: 0.4 });
  }, function () { scene.remove(m); m.material.dispose(); });
}

function wingShape(w, h) {

}

function trigger(key, user) {

  const heat = C.resource.mode === 'heat';
  if (heat) { if (resLock > 0) { if (user) toast('Overheated!'); return false; } }
  else if (res < (a.cost || 0)) { if (user) toast('Not enough ' + C.resource.name); return false; }
  if (!C.act[key](user)) return false;

      toast('Overheated!'); emit(chest().add(V(0, 0.6, 0)), 60, '#bbbbbb', { speed: 1.4, lift: 1.5, life: 1.4, spread: 0.6 });

  heroLight.color.copy(specColor);

  // camera
  if (camT < 1) {

    controls.target.lerpVectors(tgtFrom, tgtTo, k);
  } else {
    const want = H.position.clone().setY(1.3);
    const delta = want.sub(controls.target).multiplyScalar(Math.min(1, dt * 1.5));
    controls.target.add(delta); camera.position.add(delta);
  }
  controls.autoRotate = !reduced && camT >= 1;
  controls.update();
  if (shake > 0 && !reduced) { camera.position.x += (Math.random() - 0.5) * shake * 0.3; camera.position.y += (Math.random() - 0.5) * shake * 0.3; }
  shake = Math.max(0, shake - dt);

  // demo script
  if (userHold > 0) userHold -= dt;
  else {
    const S = C.SCRIPTS[spec];
    const prev = specClock; specClock += dt;
    const cur = specClock % S.len, pv = prev % S.len;
    for (const [a, name] of S.steps) {
      const crossed = cur >= pv ? (a > pv && a <= cur) : (a > pv || a <= cur);
      if (!crossed) continue;
      const ab = C.AB[name];
      cds[name] = 0;
      if (C.resource.mode === 'heat') { resLock = 0; if (res + (ab.cost || 0) >= C.resource.max && !ab.allowOverheat) res = Math.max(0, C.resource.max - (ab.cost || 0) - 5); }
      else if (res < (ab.cost || 0)) res = ab.cost || 0;
      trigger(name, false);

  }
  for (const k in cds) cds[k] = Math.max(0, cds[k] - dt);
  buttons.forEach(b => { const k = b.dataset.act; const a = C.AB[k]; b.querySelector('.cd').style.height = (a && a.cd ? Math.min(1, cds[k] / a.cd) * 100 : 0) + '%'; });
  if (resLock > 0) { resLock -= dt; if (Math.random() < dt * 20) emit(chest().add(V(0, 0.8, 0)), 2, '#999999', { speed: 0.4, lift: 1.2, life: 1 }); }
  res = Math.max(0, Math.min(C.resource.max, res + C.resource.regen * dt));
  $('res-num').textContent = Math.floor(res);
  $('res-fill').style.width = (res / C.resource.max * 100) + '%';
  $('res-fill').style.background = resLock > 0 ? '#ff6a4a' : '';

    if (a.buff > 0) { a.buff -= dt; if (Math.random() < dt * 10) emit(allyChest(a), 1, specColor, { speed: 0.4, lift: 0.6, life: 0.6, spread: 0.6 }); }
  }

  if (C.onFrame) C.onFrame(dt, t);

  // ambient motes
  if (Math.random() < dt * 14) {
    const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 9;
    emit(V(Math.cos(a) * r, 0.3 + Math.random(), Math.sin(a) * r), 1, C.mote || '#5a7a8f', { speed: 0.05, lift: 0.2, life: 4 });
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.t += dt;
    const p = Math.min(1, e.t / e.dur);
    e.update(e, p);
    if (p >= 1) { e.dispose(); effects.splice(i, 1); }
  }
  updateParticles(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

} catch (err) { showError(err && err.message ? err.message : err); }
})();
</script>
