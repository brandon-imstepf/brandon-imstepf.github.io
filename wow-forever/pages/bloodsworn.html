<style>
/* Layout: full-bleed 3D stage; codex card top-left, resource meter + action bar + spec tabs along the bottom. Single committed night theme. */

:root {
  color-scheme: dark;
  --night: #090b0e; --stone: #13171c; --bone: #e8e2d2; --ash: #a1a7ad;
  --line: rgba(232, 226, 210, 0.16); --veil: rgba(8, 10, 13, 0.76); --spec: #e0485a;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--bone); font-family: var(--body); font-size: 15px; overflow: hidden; }
.stage { position: fixed; inset: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ui > * { pointer-events: auto; }
.codex { align-self: flex-start; width: min(380px, 100%); max-height: 46vh; overflow-y: auto; background: var(--veil); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-left: 2px solid var(--spec); border-radius: 4px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color .6s; }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash); margin: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 0; text-wrap: balance; }
.role { margin: 0; color: var(--spec); font-weight: 500; letter-spacing: .02em; transition: color .6s; }
.desc { margin: 0; line-height: 1.45; }
.abilities { list-style: none; margin: 4px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
.abilities li { display: grid; grid-template-columns: 8px 1fr; gap: 8px; line-height: 1.35; font-size: 14px; color: var(--ash); }
.abilities li::before { content: ""; width: 6px; height: 6px; margin-top: 7px; transform: rotate(45deg); background: var(--spec); transition: background .6s; }
.abilities b { color: var(--bone); font-weight: 700; }
.bottom { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.specs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.specs button { font: 500 14px var(--body); color: var(--ash); background: var(--veil); border: 1px solid var(--line); border-radius: 3px; padding: 7px 14px; cursor: pointer; letter-spacing: .03em; }
.specs button:hover { color: var(--bone); }
.specs button[aria-selected="true"] { color: var(--night); background: var(--spec); border-color: var(--spec); }
.specs button:focus-visible, .bar button:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; gap: 8px; background: var(--veil); border: 1px solid var(--line); border-radius: 4px; padding: 8px; max-width: 100%; }
.meter { display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px; min-width: 150px; font-variant-numeric: tabular-nums; }
.meter span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); display: flex; justify-content: space-between; gap: 10px; }
.meter span b { color: var(--bone); font-weight: 700; letter-spacing: 0; text-transform: none; }
.meter i { display: block; height: 8px; border-radius: 2px; background: #0b0d10; border: 1px solid var(--line); overflow: hidden; }
.meter i em { display: block; height: 100%; width: 0; background: var(--spec); transition: width .15s linear; }
.bar button { position: relative; overflow: hidden; width: 96px; min-height: 58px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 2px;
  font: 500 13px/1.15 var(--body); color: var(--bone); text-align: left; background: var(--stone); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; cursor: pointer; }
.bar button:hover { border-color: var(--spec); }
.bar button kbd { font: 11px var(--body); color: var(--ash); }
.bar button small { font-size: 11px; color: var(--spec); transition: color .6s; }
.bar button .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.55); pointer-events: none; }
.hint { margin: 0; font-size: 12px; color: var(--ash); text-align: center; }
.toast { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); font-family: var(--display); font-size: 22px; color: #ff8f7a; text-shadow: 0 2px 8px #000; pointer-events: none; opacity: 0; transition: opacity .3s; }
.toast.show { opacity: 1; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ash); }
@media (max-width: 560px) { .codex { max-height: 32vh; padding: 12px 14px; } .desc { font-size: 14px; } .bar button { width: calc(33% - 6px); min-height: 50px; } .meter { width: 100%; } }

<script>
(function () {

}

if (typeof THREE === 'undefined') { showError('the 3D library did not load'); return; }
try {
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Setup ---------- */
const stage = document.getElementById('stage');

camera.position.set(14, 10, 18);
const controls = new THREE.OrbitControls(camera, renderer.domElement);

/* ---------- Helpers ---------- */
let seed = 7;

}
function std(color, o) { return new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.8 }, o || {})); }
function glowMat(color, i) { return new THREE.MeshStandardMaterial({ color: '#000000', emissive: color, emissiveIntensity: i || 1.8 }); }

const M = {
  stone: std('#3b4248', { roughness: 0.95 }),
  stoneDark: std('#262b30', { roughness: 1 }),
  iron: std('#59616a', { roughness: 0.45, metalness: 0.75 }),
  ironDark: std('#30353b', { roughness: 0.5, metalness: 0.7 }),
  leather: std('#4a3424', { roughness: 0.9 }),
  wood: std('#4a3626', { roughness: 1 }),
  cloth: std('#2a2f3a', { roughness: 0.95, side: THREE.DoubleSide }),
  skin: std('#d9b99a', { roughness: 0.7 }),
  glow: glowMat('#ffffff', 1.8),
  trim: new THREE.MeshStandardMaterial({ color: '#222', emissive: '#ffffff', emissiveIntensity: 0.6, roughness: 0.6 }),
  foe: std('#3a2c3c', { roughness: 0.85 }),
  foeEye: glowMat('#ff5a3c', 2),
  horn: std('#b9ad94', { roughness: 0.7 }),
  blade: std('#c9d0d6', { roughness: 0.25, metalness: 0.95 }),
  ally: std('#3b5b8f', { roughness: 0.7 }),
  allySkin: std('#c7a389', { roughness: 0.7 }),

const accentMats = [M.glow, M.trim];

/* ---------- Lights and ground (the class's world() adds its own scenery) ---------- */
const hemi = new THREE.HemisphereLight('#6a7f99', '#0f0d0b', 0.55); scene.add(hemi);
const moonLight = new THREE.DirectionalLight('#b3c6e0', 1.2);
moonLight.position.set(-10, 16, -8); moonLight.castShadow = true;
moonLight.shadow.mapSize.set(1024, 1024);
Object.assign(moonLight.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
moonLight.shadow.camera.updateProjectionMatrix();
scene.add(moonLight);
const moon = new THREE.Mesh(new THREE.SphereGeometry(2.4, 32, 16), new THREE.MeshBasicMaterial({ color: '#e2e8f2', fog: false }));
moon.position.set(-36, 28, -46); scene.add(moon);
const groundMat = std('#14191c', { roughness: 1 });
const ground = mesh(new THREE.CircleGeometry(40, 64), groundMat);
ground.rotation.x = -Math.PI / 2; ground.castShadow = false; scene.add(ground);

/* ---------- Particles ---------- */
const MAXP = 4000;
const pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3);
const pVel = new Float32Array(MAXP * 3), pLife = new Float32Array(MAXP), pMax = new Float32Array(MAXP), pBase = new Float32Array(MAXP * 3), pGrav = new Float32Array(MAXP);
let pNext = 0;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const dotCanvas = document.createElement('canvas'); dotCanvas.width = dotCanvas.height = 64;
{ const c = dotCanvas.getContext('2d'); const g = c.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, 64, 64); }
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.16, map: new THREE.CanvasTexture(dotCanvas), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));

function emit(pos, n, color, o) {
  o = o || {};

  const speed = o.speed !== undefined ? o.speed : 2, up = o.up !== undefined ? o.up : 1, life = o.life || 1, spread = o.spread !== undefined ? o.spread : 0.2;
  for (let i = 0; i < n; i++) {

    pPos[k * 3 + 1] = pos.y + (Math.random() - 0.5) * spread;
    pPos[k * 3 + 2] = pos.z + (Math.random() - 0.5) * spread;
    pVel[k * 3] = Math.cos(a) * Math.cos(el) * s;
    pVel[k * 3 + 1] = Math.abs(Math.sin(el)) * s * up + (o.lift || 0);
    pVel[k * 3 + 2] = Math.sin(a) * Math.cos(el) * s;

/* ---------- Timed effects ---------- */
const effects = [];
function timed(dur, update, dispose) { effects.push({ t: 0, dur: dur, update: update, dispose: dispose || function () {} }); }
function later(sec, fn) { timed(sec, function () {}, fn); }
function ring(pos, color, r1, dur, width) {

let shake = 0;
function shakeCam(n) { shake = Math.max(shake, n); }

/* ---------- Sprites: floating text and symbols ---------- */
const spriteCache = {};
function textTexture(text, color, size) {

  const g = c.getContext('2d');
  g.font = `bold ${size || 64}px Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.85)'; g.strokeText(text, 128, 64);

}
function floatSymbol(pos, ch, color, o) {

  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTexture(ch, color, 90), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));

/* ---------- Hero ---------- */

/* ---------- Resource ---------- */
let res = 0, resLock = 0;
function gain(n) { res = Math.max(0, Math.min(C.resource.max, res + n)); }

/* ---------- Enemies ---------- */
const foes = [], decoys = [];
function makeFoe() {

  const mat = M.foe.clone();
  g.add(mesh(new THREE.CylinderGeometry(0.28, 0.35, 0.95, 9), mat, 0, 0.95, 0));
  g.add(mesh(new THREE.SphereGeometry(0.25, 12, 10), mat, 0, 1.6, 0.03));

           a: rand() * Math.PI * 2, r: 5 + rand() * 2.5, speed: 1.1 + rand() * 0.5, bob: rand() * 6, prey: null, atk: 0 };
}
function spawnFoe(f) {

  f.a = rand() * Math.PI * 2; f.r = 7.5;

/* ---------- Projectiles and beams ---------- */
function bolt(from, toGet, color, size, dur, onHit, o) {
  o = o || {};
  const m = new THREE.Mesh(o.geo || new THREE.SphereGeometry(size || 0.15, 10, 8), o.mat || glowMat(color, 2.2));
  m.position.copy(from); scene.add(m);
  const start = from.clone();
  timed(dur || 0.5, function (e, p) {
    const end = toGet();
    m.position.lerpVectors(start, end, p); m.position.y += Math.sin(Math.PI * p) * (o.arc || 0);
    if (o.spin) m.rotation.x += 0.4;
    emit(m.position, o.trail || 2, color, { speed: 0.2, life: 0.4, spread: 0.05 });
  }, function () { scene.remove(m); if (onHit) onHit(m.position.clone()); });
}
function beam(getA, getB, dur, color, width) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(width || 0.05, width || 0.05, 1, 8, 1, true), addMat(color, 0.85));
  scene.add(m);
  timed(dur, function (e, p) {
    const a = getA(), b = getB();
    const mid = a.clone().add(b).multiplyScalar(0.5);
    m.position.copy(mid);
    m.scale.set(1 + Math.sin(e.t * 30) * 0.2, a.distanceTo(b), 1 + Math.sin(e.t * 30) * 0.2);
    m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize());
    m.material.opacity = 0.85 * Math.min(1, (1 - p) * 5);
    if (Math.random() < 0.5) emit(a.clone().lerp(b, Math.random()), 1, color, { speed: 0.3, life: 0.4 });
  }, function () { scene.remove(m); m.material.dispose(); });
}

      swingAnim('raise');
      const c = allies.reduce((s, a) => s.add(a.g.position), heroPos()).multiplyScalar(1 / (allies.length + 1)).setY(0.2);
      pools.push(makePool(c, 2.6, 7, 'heal'));
      popText(c.clone().add(V(0, 2.2, 0)), 'Wellspring', mend, 1);
      return true;
    },
    rite(user) {
      if (user && res < 40) { toast('Not enough Vitae'); return false; }
      const a = lowestAlly();
      if (!a) return false;
      res = 0;
      faceTo(a.g.position); swingAnim('raise');
      const col = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 6, 20, 1, true), addMat(blood, 0.5)); col.position.copy(a.g.position).setY(3); scene.add(col);
      timed(1.2, (e, p) => { col.material.opacity = 0.5 * (1 - p); col.scale.set(1 - p * 0.5, 1, 1 - p * 0.5); }, () => scene.remove(col));
      heal(a, 1, mend);
      popText(allyChest(a).add(V(0, 1.4, 0)), 'Last Rite', mend, 1.1);
      return true;
    },
    call() {
      swingAnim('raise');
      for (const f of alive()) if (f.g.position.distanceTo(heroPos()) < 9) {
        f.taunt = 6;
        beam(() => foeChest(f), () => chest(), 0.5, blood, 0.03);
      }
      ring(heroPos(), blood, 8, 0.8, 0.05);
      popText(chest().add(V(0, 1.6, 0)), 'Blood Call', blood, 0.9);
      return true;
    },
    ground() {
      swingAnim('raise');
      pools.push(makePool(heroPos().setY(0.2), 2.4, 7, 'harm'));
      return true;
    },
    ward() {
      wardHP = 1; wardT = 8; P.ward.visible = true;
      swingAnim('raise');
      emit(chest(), 30, blood, { speed: 1.4, life: 0.6, spread: 0.6 });
      popText(chest().add(V(0, 1.6, 0)), 'Clotting Ward', blood, 0.9);
      return true;
    },
    harvest() {
      swingAnim('spin');
      for (const d of [0.15, 0.4]) later(d, () => { hitArea(heroPos(), 2.8, 0.8, blood); ring(heroPos(), blood, 2.8, 0.4, 0.08); emit(chest(), 20, bloodDark, { speed: 3, life: 0.5 }); });
      return true;
    },
    exsang(user) {
      const f = strikeTarget(user);
      if (!f) return false;
      swingAnim('thrust');
      later(0.2, () => {
        const bleeding = f.dot > 0;
        hit(f, bleeding ? 3.2 : 1.8, blood); f.dot = 0;
        popText(foeChest(f).add(V(0, 1, 0)), 'Exsanguinate', blood, 1);
        emit(foeChest(f), 40, bloodDark, { speed: 3, gravity: 6, life: 0.7 });
        bleedOut(() => foeChest(f), 10);
        shakeCam(0.2);
      });
      return true;
    },
  },

  animate(dt, t, s, kind) {
    P.head.rotation.y = Math.sin(t * 0.8) * 0.12;
    P.cape.rotation.x = 0.12 + Math.sin(t * 1.3) * 0.04;
    if (kind === 'slash' && s > 0) { P.rArm.rotation.x = -0.4 - 2.0 * s; P.rArm.rotation.z = 0.5 * s; }
    else if (kind === 'thrust' && s > 0) { P.rArm.rotation.x = -1.5 * s; P.rArm.rotation.z = 0; P.lArm.rotation.x = -1.4 * s; }
    else if (kind === 'cast' && s > 0) { P.lArm.rotation.x = -1.6 * s; }
    else if (kind === 'raise' && s > 0) { P.rArm.rotation.x = -2.6 * s; P.lArm.rotation.x = -2.6 * s; }
    else if (kind === 'spin' && s > 0) { P.rArm.rotation.z = -1.3 * s; P.rArm.rotation.x = -1.4 * s; H.rotation.y += dt * 16; }
    else {
      P.rArm.rotation.x += (-0.35 - P.rArm.rotation.x) * dt * 6; P.rArm.rotation.z *= 0.9;
      P.lArm.rotation.x += (-0.15 - P.lArm.rotation.x) * dt * 6;
    }
  },

  onFrame(dt, t) {
    if (Math.random() < dt * 14) emit(fountainTop, 1, blood, { speed: 0.6, up: 2, gravity: 6, life: 0.7, spread: 0.1 });
    // Crimson Aura: allies mend while it lasts
    if (auraT > 0) {
      auraT -= dt;
      P.aura.material.opacity = 0.7 * Math.min(1, auraT) * (0.7 + Math.sin(t * 4) * 0.3);
      P.aura.rotation.z += dt;
      if (Math.random() < dt * 0.8) { const a = lowestAlly(); if (a) heal(a, 0.04, mend); }
      if (auraT <= 0) P.aura.visible = false;
    }
    // Clotting Ward
    if (wardT > 0) {
      wardT -= dt;
      P.ward.material.opacity = 0.12 + wardHP * 0.12 + Math.sin(t * 5) * 0.03;
      if (wardT <= 0) { wardHP = 0; P.ward.visible = false; }
    }
    // pools: Crimson Ground burns enemies, Wellspring heals allies
    for (let i = pools.length - 1; i >= 0; i--) {
      const p = pools[i];
      p.life -= dt; p.tick -= dt;
      const k = Math.max(0, Math.min(1, p.life, (p.max - p.life) * 3));
      p.m.material.opacity = 0.8 * k; p.rim.material.opacity = 0.8 * k * (0.6 + Math.sin(t * 6) * 0.4);
      if (Math.random() < dt * 14) emit(p.m.position.clone().add(V((Math.random() - 0.5) * p.r * 1.6, 0.1, (Math.random() - 0.5) * p.r * 1.6)), 1, p.kind === 'heal' ? mend : blood, { speed: 0.1, lift: 1, life: 0.8 });
      if (p.tick <= 0) {
        p.tick = 0.7;
        if (p.kind === 'harm') { for (const f of alive()) if (f.g.position.distanceTo(p.m.position) < p.r) { hit(f, 0.35, blood, true); gain(2); } }
        else for (const a of allies) if (a.g.position.distanceTo(p.m.position) < p.r + 0.5) heal(a, 0.06, mend);
      }
      if (p.life <= 0) { scene.remove(p.m); scene.remove(p.rim); p.m.material.dispose(); p.rim.material.dispose(); pools.splice(i, 1); }
    }
    // Blood Bond links
    for (let i = links.length - 1; i >= 0; i--) {
      const l = links[i]; l.life -= dt;
      l.m.position.copy(l.a.g.position).setY(0.3); l.m.rotation.z += dt * 2;
      if (Math.random() < dt * 8) emit(allyChest(l.a).lerp(chest(), Math.random()), 1, blood, { speed: 0.1, life: 0.5 });
      if (l.life <= 0) { scene.remove(l.m); links.splice(i, 1); }
    }
  },
};
const fountainTop = V();

function makePool(pos, r, life, kind) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 32), new THREE.MeshBasicMaterial({ color: kind === 'heal' ? '#3a0814' : '#24040c', transparent: true, opacity: 0, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.copy(pos); scene.add(m);
  const rim = new THREE.Mesh(new THREE.RingGeometry(r * 0.95, r, 48), addMat(kind === 'heal' ? mend : blood, 0)); rim.rotation.x = -Math.PI / 2; rim.position.copy(pos).setY(pos.y + 0.01); scene.add(rim);
  return { m: m, rim: rim, life: life, max: life, tick: 0, r: r, kind: kind };
}

/* ================= LOOP ================= */
/* ---------- Build the class ---------- */
specColor.set(C.SPECS.overview.color); targetColor.set(C.SPECS.overview.color);
if (C.world) C.world();
C.build();
for (let i = 0; i < (C.allies || 0); i++) allies.push(makeAlly(i));
for (let i = 0; i < 5; i++) { const f = makeFoe(); foes.push(f); spawnFoe(f); f.g.position.y = 0.18; f.state = 'roam'; f.r = 4.8 + i * 0.5; f.a = i / 5 * Math.PI * 2; f.g.position.set(Math.cos(f.a) * f.r, 0.18, Math.sin(f.a) * f.r); }
res = C.resource.start;

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastT = 0;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); toastT = 1.5; }
const cds = {};
for (const k in C.AB) cds[k] = 0;
const buttons = [...document.querySelectorAll('.bar button')];
$('res-name').textContent = C.resource.name;
$('read-name').textContent = C.readoutLabel || '';
let spec = 'overview', specClock = 0, userHold = 0;
let camFrom = camera.position.clone(), camTo = new THREE.Vector3(...C.SPECS.overview.cam);
let tgtFrom = controls.target.clone(), tgtTo = new THREE.Vector3(...C.SPECS.overview.target);
let camT = 0, camDur = 3.4;
const ease = t => 1 - Math.pow(1 - t, 3);

function setSpec(name, fromHash) {
  if (!C.SPECS[name]) name = 'overview';
  spec = name; specClock = 0;
  const S = C.SPECS[name];
  $('spec-name').textContent = S.name;
  $('spec-role').textContent = S.role;
  $('spec-desc').textContent = S.desc;
  $('spec-abilities').innerHTML = S.abilities.map(([n, d]) => `<li><span><b>${n}</b> — ${d}</span></li>`).join('');
  document.documentElement.style.setProperty('--spec', S.color);
  targetColor.set(S.color);
  document.querySelectorAll('.specs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.spec === name)));
  buttons.forEach((b, i) => { const k = S.bar[i]; const a = C.AB[k]; b.dataset.act = k; b.querySelector('.nm').textContent = a.name; b.querySelector('.ct').textContent = a.line; });
  camFrom = camera.position.clone(); tgtFrom = controls.target.clone();
  camTo = new THREE.Vector3(...S.cam); tgtTo = new THREE.Vector3(...S.target); camT = 0; camDur = 1.6;
  if (C.onSpec) C.onSpec(name);
  if (!fromHash) { try { history.replaceState(null, '', name === 'overview' ? location.pathname + location.search : '#' + name); } catch (e) { /* optional */ } }
}
document.querySelectorAll('.specs button').forEach(b => b.addEventListener('click', () => setSpec(b.dataset.spec)));
addEventListener('hashchange', () => setSpec(location.hash.slice(1), true));

function trigger(key, user) {
  const a = C.AB[key];
  if (!a || cds[key] > 0) return false;
  const heat = C.resource.mode === 'heat';
  if (heat) { if (resLock > 0) { if (user) toast('Overheated!'); return false; } }
  else if (res < (a.cost || 0)) { if (user) toast('Not enough ' + C.resource.name); return false; }
  if (!C.act[key](user)) return false;
  if (heat) {
    res += a.cost || 0;
    if (res >= C.resource.max) {
      res = C.resource.max; resLock = C.resource.lock || 2.5;
      toast('Overheated!'); emit(chest().add(V(0, 0.6, 0)), 60, '#bbbbbb', { speed: 1.4, lift: 1.5, life: 1.4, spread: 0.6 });
      if (C.onOverheat) C.onOverheat();
    }
  } else res -= a.cost || 0;
  cds[key] = a.cd || 0;
  return true;
}
buttons.forEach(b => b.addEventListener('click', () => { trigger(b.dataset.act, true); userHold = 6; }));
addEventListener('keydown', e => { const i = '12345'.indexOf(e.key); if (i >= 0 && buttons[i]) { trigger(buttons[i].dataset.act, true); userHold = 6; } });

setSpec(location.hash.slice(1) || 'overview', true);
camera.position.set(16, 11, 20); camFrom = camera.position.clone(); camT = 0; camDur = 3.4;

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
const TAU = Math.PI * 2;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  specColor.lerp(targetColor, Math.min(1, dt * 3));
  for (const m of accentMats) m.emissive.copy(specColor);
  heroLight.color.copy(specColor);

  // camera
  if (camT < 1) {
    camT = Math.min(1, camT + dt / camDur);
    const k = ease(camT);
    camera.position.lerpVectors(camFrom, camTo, k);
    controls.target.lerpVectors(tgtFrom, tgtTo, k);
  } else {
    const want = H.position.clone().setY(1.3);
    const delta = want.sub(controls.target).multiplyScalar(Math.min(1, dt * 1.5));
    controls.target.add(delta); camera.position.add(delta);
  }
  controls.autoRotate = !reduced && camT >= 1;
  controls.update();
  if (shake > 0 && !reduced) { camera.position.x += (Math.random() - 0.5) * shake * 0.3; camera.position.y += (Math.random() - 0.5) * shake * 0.3; }
  shake = Math.max(0, shake - dt);

  // demo script
  if (userHold > 0) userHold -= dt;
  else {
    const S = C.SCRIPTS[spec];
    const prev = specClock; specClock += dt;
    const cur = specClock % S.len, pv = prev % S.len;
    for (const [a, name] of S.steps) {
      const crossed = cur >= pv ? (a > pv && a <= cur) : (a > pv || a <= cur);
      if (!crossed) continue;
      const ab = C.AB[name];
      cds[name] = 0;
      if (C.resource.mode === 'heat') { resLock = 0; if (res + (ab.cost || 0) >= C.resource.max && !ab.allowOverheat) res = Math.max(0, C.resource.max - (ab.cost || 0) - 5); }
      else if (res < (ab.cost || 0)) res = ab.cost || 0;
      trigger(name, false);
    }
  }
  for (const k in cds) cds[k] = Math.max(0, cds[k] - dt);
  buttons.forEach(b => { const k = b.dataset.act; const a = C.AB[k]; b.querySelector('.cd').style.height = (a && a.cd ? Math.min(1, cds[k] / a.cd) * 100 : 0) + '%'; });
  if (resLock > 0) { resLock -= dt; if (Math.random() < dt * 20) emit(chest().add(V(0, 0.8, 0)), 2, '#999999', { speed: 0.4, lift: 1.2, life: 1 }); }
  res = Math.max(0, Math.min(C.resource.max, res + C.resource.regen * dt));
  $('res-num').textContent = Math.floor(res);
  $('res-fill').style.width = (res / C.resource.max * 100) + '%';
  $('res-fill').style.background = resLock > 0 ? '#ff6a4a' : '';
  $('read-val').textContent = C.readout ? C.readout() : '';

  // hero facing and idle
  H.rotation.y = ((H.rotation.y % TAU) + TAU) % TAU;
  let turn = facing - H.rotation.y;
  turn = ((turn % TAU) + TAU) % TAU; if (turn > Math.PI) turn -= TAU;
  if (!(swing > 0 && swingKind === 'spin')) H.rotation.y += turn * Math.min(1, dt * 10);
  if (swing > 0) swing = Math.max(0, swing - dt * 2.6);
  C.animate(dt, t, swing > 0 ? Math.sin((1 - swing) * Math.PI) : 0, swingKind);
  heroLight.position.copy(H.position).add(V(0, 2.4, 0.6));
  if (H.position.length() > 5.5) H.position.multiplyScalar(1 - dt * 0.3);

  // decoys expire
  for (let i = decoys.length - 1; i >= 0; i--) { if (decoys[i].dead) decoys.splice(i, 1); }

  // enemies
  for (const f of foes) {
    f.t += dt;
    if (f.flash > 0) { f.flash -= dt; f.mat.emissive.set(f.flash > 0 ? '#ff6a4a' : '#000000'); f.mat.emissiveIntensity = 0.8; }
    if (f.state === 'spawn') { f.g.position.y = Math.min(0.18, f.g.position.y + dt * 2); if (f.g.position.y >= 0.18) f.state = 'roam'; continue; }
    if (f.state === 'dying') { f.g.scale.setScalar(Math.max(0.01, 1 - f.t * 1.8)); f.g.position.y -= dt * 0.6; if (f.t > 0.6) { f.state = 'dead'; f.g.visible = false; f.t = 0; } continue; }
    if (f.state === 'dead') { if (f.t > 1.4) spawnFoe(f); continue; }
    if (f.dot > 0) { f.dot -= dt; if (Math.random() < dt * 6) emit(foeChest(f), 2, f.dotColor, { speed: 0.3, lift: 0.6, life: 0.7 }); if (Math.random() < dt * 0.8) hit(f, 0.5, f.dotColor, true); }
    if (f.state !== 'roam') continue;
    if (f.stun > 0) { f.stun -= dt; f.g.rotation.z = Math.sin(t * 20) * 0.05; if (Math.random() < dt * 4) emit(foeChest(f).add(V(0, 0.8, 0)), 1, '#ffe08a', { speed: 0.3, life: 0.6 }); continue; }
    f.g.rotation.z = 0;
    if (f.pull) {
      f.pull.t += dt;
      const goal = f.pull.to().setY(0.18);
      f.g.position.lerp(goal, Math.min(1, dt * 6));
      if (f.pull.t > (f.pull.dur || 0.8)) f.pull = null;
      continue;
    }
    if (f.rooted > 0) { f.rooted -= dt; continue; }
    // pick who to fight: a decoy if fooled, the hero if taunted or close, else an ally
    let preyPos = null, preyIsHero = false, preyAlly = null;
    if (f.decoyed > 0 && decoys.length) { f.decoyed -= dt; let best = null, bd = 1e9; for (const d of decoys) { const dd = d.pos().distanceTo(f.g.position); if (dd < bd) { bd = dd; best = d; } } preyPos = best.pos(); f.prey = best; }
    else {
      f.taunt = Math.max(0, f.taunt - dt);
      const dh = heroPos().distanceTo(f.g.position);
      if (f.taunt > 0 || dh < 3.6 || !allies.length) { preyPos = heroPos(); preyIsHero = true; }
      else { if (!f.preyAlly || Math.random() < dt * 0.1) f.preyAlly = allies[Math.floor(Math.random() * allies.length)]; preyAlly = f.preyAlly; preyPos = preyAlly.g.position.clone(); }
    }
    const toP = preyPos.clone().sub(f.g.position).setY(0);
    const d = toP.length();
    const speed = f.speed * (f.slow > 0 ? 0.4 : 1);
    if (f.slow > 0) f.slow -= dt;
    if (d > 1.25) {
      const goal = d > 6 ? V(Math.cos(f.a) * f.r, 0, Math.sin(f.a) * f.r) : preyPos;
      const mv = goal.clone().sub(f.g.position).setY(0);
      f.a += dt * 0.25;
      if (mv.length() > 0.05) { f.g.position.addScaledVector(mv.normalize(), speed * dt); f.g.rotation.y = Math.atan2(mv.x, mv.z); }
      f.g.position.y = 0.18 + Math.abs(Math.sin(t * 7 + f.bob)) * 0.05;
    } else {
      f.g.rotation.y = Math.atan2(toP.x, toP.z);
      f.g.position.y = 0.18 + Math.max(0, Math.sin(t * 6 + f.bob)) * 0.06;
      f.atk += dt;
      if (f.atk > 1.1) {
        f.atk = 0;
        if (f.prey && f.decoyed > 0 && f.prey.onHit) { f.prey.onHit(); }
        else if (preyIsHero) { emit(chest(), 6, '#ff6a4a', { speed: 1, life: 0.3 }); if (C.onHeroHit) C.onHeroHit(1); }
        else if (preyAlly) { preyAlly.hp = Math.max(0.08, preyAlly.hp - 0.06); emit(allyChest(preyAlly), 6, '#ff6a4a', { speed: 1, life: 0.3 }); }
      }
    }
  }

  // allies: fight back, take damage, show bars
  for (const a of allies) {
    a.hp = Math.min(1, a.hp + dt * (C.allyRegen || 0.004));
    a.fg.scale.x = Math.max(0.001, a.hp); a.fg.position.x = -0.43 * (1 - a.hp);
    a.fg.material.color.set(a.hp > 0.5 ? '#3fd16a' : a.hp > 0.25 ? '#e0c040' : '#e04a3a');
    a.bar.quaternion.copy(camera.quaternion);
    const tgt = nearest(a.g.position);
    if (tgt && tgt.g.position.distanceTo(a.g.position) < 1.8) {
      const dir = tgt.g.position.clone().sub(a.g.position);
      a.g.rotation.y = Math.atan2(dir.x, dir.z);
      a.swing += dt * (1 + (a.buff > 0 ? 1.2 : 0));
      if (a.swing > 1.2) { a.swing = 0; hit(tgt, 0.5, '#ffffff', true); emit(foeChest(tgt), 6, '#ffffff', { speed: 1.5, life: 0.3 }); }
      a.arm.rotation.x = -Math.sin(Math.min(1, a.swing * 3) * Math.PI) * 1.4;
    } else {
      const home = a.home.clone().add(heroPos().multiplyScalar(0.6));
      const mv = home.sub(a.g.position).setY(0);
      if (mv.length() > 0.3) { a.g.position.addScaledVector(mv.normalize(), dt * 1.6); a.g.rotation.y = Math.atan2(mv.x, mv.z); }
      a.arm.rotation.x *= 0.9;
    }
    if (a.buff > 0) { a.buff -= dt; if (Math.random() < dt * 10) emit(allyChest(a), 1, specColor, { speed: 0.4, lift: 0.6, life: 0.6, spread: 0.6 }); }
  }

  if (C.onFrame) C.onFrame(dt, t);

  // ambient motes
  if (Math.random() < dt * 14) {
    const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 9;
    emit(V(Math.cos(a) * r, 0.3 + Math.random(), Math.sin(a) * r), 1, C.mote || '#5a7a8f', { speed: 0.05, lift: 0.2, life: 4 });
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.t += dt;
    const p = Math.min(1, e.t / e.dur);
    e.update(e, p);
    if (p >= 1) { e.dispose(); effects.splice(i, 1); }
  }
  updateParticles(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

} catch (err) { showError(err && err.message ? err.message : err); }
})();
</script>
