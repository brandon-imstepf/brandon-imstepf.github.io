<style>
/* Layout: full-bleed 3D prison-vault stage; codex card top-left, Vengeance meter + action bar + spec tabs along the bottom. Single committed night theme. */
:root {
  color-scheme: dark;
  --night: #090b0e;
  --stone: #13171c;
  --bone: #e8e2d2;
  --ash: #a1a7ad;
  --line: rgba(232, 226, 210, 0.16);
  --veil: rgba(8, 10, 13, 0.76);
  --spec: #e0b25c;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--bone); font-family: var(--body); font-size: 15px; overflow: hidden; }
.stage { position: fixed; inset: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ui {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ui > * { pointer-events: auto; }
.codex {
  align-self: flex-start; width: min(380px, 100%); max-height: 46vh; overflow-y: auto;
  background: var(--veil); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-left: 2px solid var(--spec); border-radius: 4px;
  padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color .6s;
}
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ash); margin: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 0; text-wrap: balance; }
.role { margin: 0; color: var(--spec); font-weight: 500; letter-spacing: .02em; transition: color .6s; }
.desc { margin: 0; line-height: 1.45; }
.abilities { list-style: none; margin: 4px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 7px; }
.abilities li { display: grid; grid-template-columns: 8px 1fr; gap: 8px; line-height: 1.35; font-size: 14px; color: var(--ash); }
.abilities li::before { content: ""; width: 6px; height: 6px; margin-top: 7px; transform: rotate(45deg); background: var(--spec); transition: background .6s; }
.abilities b { color: var(--bone); font-weight: 700; }
.bottom { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.specs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.specs button { font: 500 14px var(--body); color: var(--ash); background: var(--veil); border: 1px solid var(--line); border-radius: 3px; padding: 7px 14px; cursor: pointer; letter-spacing: .03em; }
.specs button:hover { color: var(--bone); }
.specs button[aria-selected="true"] { color: var(--night); background: var(--spec); border-color: var(--spec); }
.specs button:focus-visible, .bar button:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; gap: 8px; background: var(--veil); border: 1px solid var(--line); border-radius: 4px; padding: 8px; max-width: 100%; }
.meter { display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px; min-width: 150px; font-variant-numeric: tabular-nums; }
.meter span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); display: flex; justify-content: space-between; }
.meter span b { color: var(--bone); font-weight: 700; letter-spacing: 0; }
.meter i { display: block; height: 8px; border-radius: 2px; background: #0b0d10; border: 1px solid var(--line); overflow: hidden; }
.meter i em { display: block; height: 100%; width: 0; background: var(--spec); transition: width .15s linear; }
.bar button {
  position: relative; overflow: hidden; width: 96px; min-height: 58px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 2px;
  font: 500 13px/1.15 var(--body); color: var(--bone); text-align: left;
  background: var(--stone); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; cursor: pointer;
}
.bar button:hover { border-color: var(--spec); }
.bar button kbd { font: 11px var(--body); color: var(--ash); }
.bar button small { font-size: 11px; color: var(--spec); transition: color .6s; }
.bar button .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.55); pointer-events: none; }
.hint { margin: 0; font-size: 12px; color: var(--ash); text-align: center; }
.toast { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); font-family: var(--display); font-size: 22px; color: #ff8f7a; text-shadow: 0 2px 8px #000; pointer-events: none; opacity: 0; transition: opacity .3s; }
.toast.show { opacity: 1; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ash); }
@media (max-width: 560px) {
  .codex { max-height: 32vh; padding: 12px 14px; }
  .desc { font-size: 14px; }
  .bar button { width: calc(33% - 6px); min-height: 50px; }
  .meter { width: 100%; }
}
</style>

</div>

          if (!u.target || u.target.state !== 'roam' && u.target.state !== 'flee') u.target = (i % 2 === 0 && quarry) ? quarry : alive()[i % Math.max(1, alive().length)];
          if (u.target) {
            const goal = foeChest(u.target).add(new THREE.Vector3(Math.cos(t * 3 + i) * 0.6, 0.2, Math.sin(t * 3 + i) * 0.6));
            s.position.lerp(goal, 0.08);
            u.phase += 1 / 60;
            if (u.phase > 0.9) { u.phase = 0; hit(u.target, 1, specColor); }
          }
        }
        s.lookAt(s.position.clone().add(new THREE.Vector3(Math.cos(u.a), 0, Math.sin(u.a))));
        emit(s.position, 1, specColor, { speed: 0.1, life: 0.5, spread: 0.1 });
      });
      sm.opacity = 0.75 * Math.min(1, (1 - p) * 5);
    }, function () { list.forEach(s => scene.remove(s)); sm.dispose(); });
    return true;
  },
  vigil() {
    swingAnim('raise');
    const dome = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: specColor.clone(), transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    const rim = new THREE.Mesh(new THREE.TorusGeometry(4, 0.04, 6, 64), M.glow); rim.rotation.x = Math.PI / 2;
    scene.add(dome); scene.add(rim);
    // spells hitting the ward and fizzling
    const bolts = [];
    timed(7, function (e, p) {
      dome.position.copy(warden.position).setY(0.2); rim.position.copy(warden.position).setY(0.25);
      dome.material.opacity = 0.12 * Math.min(1, e.t * 3, (1 - p) * 6);
      if (Math.random() < 0.05) {
        const from = randomEdge();
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshBasicMaterial({ color: '#b35cff' }));
        b.position.copy(from); b.userData.t = 0; scene.add(b); bolts.push(b);
      }
      for (let i = bolts.length - 1; i >= 0; i--) {
        const b = bolts[i]; b.userData.t += 1 / 60;
        const dir = warden.position.clone().setY(1.2).sub(b.position); const d = dir.length();
        b.position.addScaledVector(dir.normalize(), 0.18);
        emit(b.position, 1, '#b35cff', { speed: 0.1, life: 0.3, spread: 0.05 });
        if (d < 4.1) { emit(b.position, 25, specColor, { speed: 2, life: 0.5 }); scene.remove(b); bolts.splice(i, 1); gain(4); }
      }
    }, function () { scene.remove(dome); scene.remove(rim); bolts.forEach(b => scene.remove(b)); });
    return true;
  }
};
function randomEdge() { const a = Math.random() * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * 9, 1.4, Math.sin(a) * 9); }

/* ---------- Demo scripts ---------- */
const SCRIPTS = {
  overview: { len: 14, steps: [[0.6, 'mark'], [1.6, 'blink'], [2.6, 'fan'], [4.2, 'chains'], [6, 'fan'], [7.5, 'cage'], [9.2, 'blink'], [10.4, 'fan'], [12, 'mark']] },
  jailer: { len: 14, steps: [[0.5, 'bulwark'], [1.6, 'mark'], [2.4, 'chains'], [4.2, 'fan'], [5.8, 'cage'], [7.6, 'chains'], [9, 'fan'], [11, 'fan'], [12.5, 'chains']] },
  avenger: { len: 12, steps: [[0.5, 'mark'], [1.3, 'strike'], [2.6, 'fan'], [3.6, 'strike'], [5, 'strike'], [6.2, 'verdict'], [8, 'mark'], [8.8, 'strike'], [10, 'fan'], [11, 'verdict']] },
  vengeance: { len: 15, steps: [[0.5, 'vigil'], [1.4, 'mark'], [2.4, 'spirits'], [5, 'fan'], [7, 'blink'], [8, 'fan'], [9.5, 'mark'], [10.5, 'spirits'], [13, 'fan']] }
};
let spec = 'overview', specClock = 0, userHold = 0;

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const buttons = [...document.querySelectorAll('.bar button')];
function setSpec(name, fromHash) {
  if (!SPECS[name]) name = 'overview';
  spec = name; specClock = 0;
  const S = SPECS[name];
  $('spec-name').textContent = S.name;
  $('spec-role').textContent = S.role;
  $('spec-desc').textContent = S.desc;
  $('spec-abilities').innerHTML = S.abilities.map(([n, d]) => `<li><span><b>${n}</b> — ${d}</span></li>`).join('');
  document.documentElement.style.setProperty('--spec', S.color);
  targetColor.set(S.color);
  document.querySelectorAll('.specs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.spec === name)));
  buttons.forEach((b, i) => { const a = AB[S.bar[i]]; b.dataset.act = S.bar[i]; b.querySelector('.nm').textContent = a.name; b.querySelector('.ct').textContent = a.line; });
  camFrom = camera.position.clone(); tgtFrom = controls.target.clone();
  camTo = new THREE.Vector3(...S.cam); tgtTo = new THREE.Vector3(...S.target); camT = 0; camDur = 1.6;
  veng = Math.max(veng, 40);
  if (!fromHash) { try { history.replaceState(null, '', name === 'overview' ? location.pathname + location.search : '#' + name); } catch (e) { /* optional */ } }
}
document.querySelectorAll('.specs button').forEach(b => b.addEventListener('click', () => setSpec(b.dataset.spec)));
addEventListener('hashchange', () => setSpec(location.hash.slice(1), true));
function trigger(key, user) {
  const a = AB[key];
  if (cds[key] > 0) return false;
  if (veng < a.cost) { if (user) toast('Not enough Vengeance'); return false; }
  if (!act[key](user)) return false;
  veng -= a.cost; cds[key] = a.cd; return true;
}
buttons.forEach(b => b.addEventListener('click', () => { trigger(b.dataset.act, true); userHold = 6; }));
addEventListener('keydown', e => { const i = '12345'.indexOf(e.key); if (i >= 0) { trigger(buttons[i].dataset.act, true); userHold = 6; } });

let camFrom = camera.position.clone(), camTo = new THREE.Vector3(...SPECS.overview.cam);
let tgtFrom = controls.target.clone(), tgtTo = new THREE.Vector3(...SPECS.overview.target);
let camT = 0, camDur = 3.4;
const ease = t => 1 - Math.pow(1 - t, 3);
setSpec(location.hash.slice(1) || 'overview', true);
camera.position.set(16, 11, 20); camFrom = camera.position.clone(); camT = 0; camDur = 3.4;

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  specColor.lerp(targetColor, Math.min(1, dt * 3));
  for (const m of accentMats) m.emissive.copy(specColor);
  wardenLight.color.copy(specColor);
  fireLights.forEach((l, i) => { l.color.copy(specColor); l.intensity = 0.8 + Math.sin(t * 7 + i) * 0.15; });
  sigil.rotation.z += dt * 0.2;

  // camera: tween to the spec's angle, then follow the warden loosely
  if (camT < 1) {
    camT = Math.min(1, camT + dt / camDur);
    const k = ease(camT);
    camera.position.lerpVectors(camFrom, camTo, k);
    controls.target.lerpVectors(tgtFrom, tgtTo, k);
  } else {
    const want = warden.position.clone().setY(1.3);
    const delta = want.sub(controls.target).multiplyScalar(Math.min(1, dt * 1.5));
    controls.target.add(delta); camera.position.add(delta);
  }
  controls.autoRotate = !reduced && camT >= 1;
  controls.update();
  if (shake > 0 && !reduced) { camera.position.x += (Math.random() - 0.5) * shake * 0.3; camera.position.y += (Math.random() - 0.5) * shake * 0.3; }
  shake = Math.max(0, shake - dt);

  // demo
  if (userHold > 0) userHold -= dt;
  else {
    const S = SCRIPTS[spec];
    const prev = specClock; specClock += dt;
    const cur = specClock % S.len, pv = prev % S.len;
    for (const [a, name] of S.steps) {
      const crossed = cur >= pv ? (a > pv && a <= cur) : (a > pv || a <= cur);
      if (crossed) { if (veng < AB[name].cost) veng = AB[name].cost; cds[name] = 0; trigger(name, false); }
    }
  }
  for (const k in cds) cds[k] = Math.max(0, cds[k] - dt);
  buttons.forEach(b => { const k = b.dataset.act; b.querySelector('.cd').style.height = (AB[k] ? cds[k] / AB[k].cd * 100 : 0) + '%'; });
  veng = Math.min(100, veng + dt * 1.5);
  $('veng-num').textContent = Math.floor(veng);
  $('veng-fill').style.width = veng + '%';

  // warden animation
  const TAU = Math.PI * 2;
  warden.rotation.y = ((warden.rotation.y % TAU) + TAU) % TAU;
  let turn = facing - warden.rotation.y;
  turn = ((turn % TAU) + TAU) % TAU; if (turn > Math.PI) turn -= TAU;
  if (!(swing > 0 && swingKind === 'spin')) warden.rotation.y += turn * Math.min(1, dt * 10);
  const idle = Math.sin(t * 1.6);
  W.helm.rotation.x = idle * 0.03;
  W.cloak.rotation.x = 0.05 + Math.sin(t * 1.3) * 0.04;
  W.links.forEach((l, i) => { l.position.x = Math.sin(t * 3 + i * 0.6) * 0.02 * i; });
  if (swing > 0) {
    swing = Math.max(0, swing - dt * 2.6);
    const s = Math.sin((1 - swing) * Math.PI);
    if (swingKind === 'slash') { W.rArm.rotation.set(-1.6 * s, 0, -0.6 * s); }
    else if (swingKind === 'overhead') { W.rArm.rotation.set(-2.6 * s, 0, 0); W.lArm.rotation.set(-2.2 * s, 0, 0); }
    else if (swingKind === 'throw') { W.rArm.rotation.set(-1.8 * s, 0, 0.3 * s); }
    else if (swingKind === 'spin') { warden.rotation.y += dt * 14 * s; W.rArm.rotation.set(0, 0, -1.4 * s); W.lArm.rotation.set(0, 0, 1.4 * s); }
    else if (swingKind === 'brace') { W.lArm.rotation.set(-1.2 * s, 0, 0.4 * s); W.rArm.rotation.set(-1.2 * s, 0, -0.4 * s); }
    else if (swingKind === 'raise') { W.lArm.rotation.set(-2.8 * s, 0, 0.2); W.rArm.rotation.set(-2.8 * s, 0, -0.2); }
  } else {
    W.rArm.rotation.x += (-0.2 - W.rArm.rotation.x) * dt * 6; W.rArm.rotation.z += (0 - W.rArm.rotation.z) * dt * 6;
    W.lArm.rotation.x += (0 - W.lArm.rotation.x) * dt * 6; W.lArm.rotation.z += (0 - W.lArm.rotation.z) * dt * 6;
    W.rArm.rotation.y = 0; W.lArm.rotation.y = 0;
  }
  wardenLight.position.copy(warden.position).add(new THREE.Vector3(0, 2.4, 0.6));
  // drift back toward the centre so the fight stays in frame
  if (warden.position.length() > 5.5) warden.position.multiplyScalar(1 - dt * 0.3);

  // enemies
  for (const f of foes) {
    f.t += dt;
    if (f.flash > 0) { f.flash -= dt; f.mat.emissive.set(f.flash > 0 ? '#ff6a4a' : '#000000'); f.mat.emissiveIntensity = 0.8; }
    if (f.state === 'spawn') { f.g.position.y = Math.min(0.18, f.g.position.y + dt * 2); if (f.g.position.y >= 0.18) f.state = 'roam'; continue; }
    if (f.state === 'dying') { f.g.scale.setScalar(Math.max(0.01, 1 - f.t * 1.8)); f.g.position.y -= dt * 0.6; if (f.t > 0.6) { f.state = 'dead'; f.g.visible = false; f.t = 0; } continue; }
    if (f.state === 'dead') { if (f.t > 1.4) spawnFoe(f); continue; }
    if (f.dot > 0) { f.dot -= dt; if (Math.random() < dt * 6) emit(foeChest(f), 2, '#7fd04a', { speed: 0.3, lift: 0.6, life: 0.7 }); }
    const legs = Math.sin(t * 7 + f.bob);
    if (f.caged > 0) { f.caged -= dt; f.g.rotation.z = Math.sin(t * 20) * 0.04; continue; }
    f.g.rotation.z = 0;
    if (f.pull) {
      f.pull.t += dt;
      if (f.pull.t > 0.35) {
        const goal = wPos().add(f.g.position.clone().sub(wPos()).setY(0).normalize().multiplyScalar(1.3));
        f.g.position.lerp(goal.setY(0.18), Math.min(1, dt * 7));
        if (f.pull.t > 0.9) { f.pull = null; if (f.state === 'flee') f.state = 'roam'; }
      }
      continue;
    }
    const toW = wPos().sub(f.g.position).setY(0);
    const d = toW.length();
    let goal;
    if (f.state === 'flee') {
      goal = f.g.position.clone().sub(toW.clone().normalize().multiplyScalar(2));
      if (f.g.position.length() > 7.5) goal = f.g.position.clone().multiplyScalar(0.9);
      if (f.t > 3.5) f.state = 'roam';
    } else if (f.taunt > 0 || d < 4) {
      f.taunt = Math.max(0, (f.taunt || 0) - dt);
      goal = wPos().sub(toW.clone().normalize().multiplyScalar(1.2));
    } else {
      f.a += dt * 0.25 * (f.bob > 3 ? 1 : -1);
      goal = new THREE.Vector3(Math.cos(f.a) * f.r, 0, Math.sin(f.a) * f.r);
    }
    const mv = goal.sub(f.g.position).setY(0);
    const ml = mv.length();
    if (ml > 0.05) {
      f.g.position.addScaledVector(mv.normalize(), Math.min(ml, f.speed * dt * (f.state === 'flee' ? 1.6 : 1)));
      f.g.rotation.y = Math.atan2(mv.x, mv.z);
      f.g.position.y = 0.18 + Math.abs(legs) * 0.05;
    } else {
      // attacking the warden
      f.g.rotation.y = Math.atan2(toW.x, toW.z);
      f.g.position.y = 0.18 + Math.max(0, Math.sin(t * 6 + f.bob)) * 0.06;
      if (Math.random() < dt * 0.8 && d < 1.8) { emit(chest(), 6, '#ff6a4a', { speed: 1, life: 0.3 }); gain(3); }
    }
  }
  // mark follows the quarry
  if (quarry && markGroup.visible) {
    markGroup.position.copy(quarry.g.position).add(new THREE.Vector3(0, 2.35 + Math.sin(t * 3) * 0.05, 0));
    markGroup.rotation.y += dt * 1.6;
  }

  // ambient embers
  if (Math.random() < dt * 14) {
    const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 9;
    emit(new THREE.Vector3(Math.cos(a) * r, 0.3 + Math.random(), Math.sin(a) * r), 1, '#5a7a8f', { speed: 0.05, lift: 0.2, life: 4 });
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.t += dt;
    const p = Math.min(1, e.t / e.dur);
    e.update(e, p);
    if (p >= 1) { e.dispose(); effects.splice(i, 1); }
  }
  updateParticles(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
} catch (err) { showError(err && err.message ? err.message : err); }
})();
</script>
